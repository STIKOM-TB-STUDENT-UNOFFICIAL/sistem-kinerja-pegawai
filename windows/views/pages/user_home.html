<section class="section">
    <div class="row">
        <div class="col-12 col-md-6">
            <div class="card">
                <div
                    class="card-body px-4 py-4 d-flex align-items-center gap-3"
                >
                    <div
                        class="rounded-circle bg-primary position-relative"
                        style="width: 56px; height: 56px; flex-shrink: 0"
                    >
                        <i
                            class="bi bi-journal-text text-white position-absolute top-50 start-50 translate-middle"
                            style="font-size: 1rem; line-height: 0"
                        ></i>
                    </div>
                    <div>
                        <p class="text-muted mb-1" style="font-size: 0.875rem">
                            Total Aktivitas
                        </p>
                        <h2 class="mb-0 fw-bold">{{.TotalAktivitas}}</h2>
                        <small class="text-muted">aktivitas tercatat</small>
                    </div>
                </div>
                <div class="card-footer px-4 py-2">
                    <a
                        href="/dashboard/aktivitas"
                        class="text-decoration-none text-primary"
                        style="font-size: 0.875rem"
                    >
                        Lihat semua aktivitas <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card">
                <div
                    class="card-body px-4 py-4 d-flex align-items-center gap-3"
                >
                    <div
                        class="rounded-circle bg-success position-relative"
                        style="width: 56px; height: 56px; flex-shrink: 0"
                    >
                        <i
                            class="bi bi-person-lines-fill text-white position-absolute top-50 start-50 translate-middle"
                            style="font-size: 1rem; line-height: 0"
                        ></i>
                    </div>
                    <div>
                        <p class="text-muted mb-1" style="font-size: 0.875rem">
                            Total Anggota
                        </p>
                        <h2 class="mb-0 fw-bold">{{.TotalAnggota}}</h2>
                        <small class="text-muted">anggota terdaftar</small>
                    </div>
                </div>
                <div class="card-footer px-4 py-2">
                    <a
                        href="/dashboard/anggota"
                        class="text-decoration-none text-success"
                        style="font-size: 0.875rem"
                    >
                        Lihat semua anggota <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
