<section class="section">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">{{.Heading}}</h4>
                </div>
                <div class="card-content">
                    <div class="card-body">
                        <form action="{{if .Periode}}/dashboard/admin/periode/update{{else}}/dashboard/admin/periode/create{{end}}" method="post">
                            {{if .Periode}}
                                <input type="hidden" name="id" value="{{.Periode.IdPeriode}}">
                            {{end}}
                            <div class="mb-2">
                                <label class="form-label">Nama Periode</label>
                                <input type="text" name="nama_periode" class="form-control" value="{{if .Periode}}{{.Periode.NamaPeriode}}{{end}}" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Start Date</label>
                                <input type="date" name="start_date" class="form-control" value="{{if .Periode}}{{.Periode.StartDate}}{{end}}" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">End Date</label>
                                <input type="date" name="end_date" class="form-control" value="{{if .Periode}}{{.Periode.EndDate}}{{end}}" required>
                            </div>

                            <div class="d-flex gap-1">
                                <a href="/dashboard/admin/periode" class="btn btn-secondary">Batal</a>
                                <button type="submit" class="btn btn-primary">Simpan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
